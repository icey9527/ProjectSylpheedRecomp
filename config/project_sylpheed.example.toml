# Copy beside project_sylpheed.exe as project_sylpheed.toml.
# Use forward slashes. Relative paths are relative to the EXE directory.
game_data_root = "game-data"
# Saves are stored below the selected resource directory by default.
# Set an absolute or EXE-relative path here to keep them elsewhere.
# user_data_root = "C:/Games/ProjectSylpheed/save"
fullscreen = false
window_width = 1280
window_height = 720
video_mode_width = 1280
video_mode_height = 720
gpu_plugin = "xenos"
# Omit this option to follow SYSTEM/ENTRY_POINT in files.tbl. The host falls
# back to GP_TITLE when the selected resources have no GP_TEST table. Set
# GP_TEST explicitly only when the matching debug tables are present.
trace_resource_bootstrap = false
allow_game_relative_writes = false
mnk_mode = true
# The cursor remains visible by default. Mouse-look capture is intentionally
# off until a visible-cursor camera path is implemented.
# Mouse motion to left-stick scale (1024-65536). Tools -> Mouse sensitivity
# adjusts it live for the current run; this key keeps the value across restarts.
mouse_look_scale = 8192
# Optional movie-start subtitle gate / parsed-count diagnostics.
trace_movie_subtitles = false
# on/off overrides the movie instance; game follows the original user profile.
movie_subtitles = "on"
# Tools -> Runtime information; disabled by default.
show_runtime_info = false
# Keep the first small-CPU warning and periodic summaries; restart after editing.
throttle_affinity_warning = true
# Short-lock host audio queue. Set false and restart to use the SDK queue.
host_audio_queue = true
# Optional 1 Hz diagnostics, not realtime callback logging.
trace_audio_queue = false
# Controller mappings; comma separates alternatives. Restart after editing.
keybind_a = "Return,Space"
keybind_b = "Backspace"
keybind_x = "L"
keybind_y = "P"
keybind_start = "X"
keybind_back = "Z,Tab"
keybind_left_shoulder = "RMB,1"
keybind_right_shoulder = "LMB,3"
keybind_left_trigger = "Q,I"
keybind_right_trigger = "E,O"
keybind_lstick_up = "W"
keybind_lstick_down = "S"
keybind_lstick_left = "A"
keybind_lstick_right = "D"
keybind_lstick_press = "F"
keybind_dpad_up = "Up"
keybind_dpad_down = "Down"
keybind_dpad_left = "Left"
keybind_dpad_right = "Right"
keybind_rstick_up = "Numpad8"
keybind_rstick_down = "Numpad2"
keybind_rstick_left = "Numpad4"
keybind_rstick_right = "Numpad6"
keybind_rstick_press = "K"
