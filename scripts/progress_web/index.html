<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工程进度 · 本地面板</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">↗</span><div><span class="eyebrow">LOCAL PROJECT / 实时工作区</span><h1 id="project">工程进度面板</h1></div></div>
      <div class="tools"><span id="connection" role="status">正在读取…</span><button id="refresh" type="button">↻ 刷新</button></div>
    </header>
    <div id="errors" class="alert" role="alert" hidden></div>
    <main>
      <section class="hero" aria-label="当前进度">
        <div class="hero-copy"><span class="eyebrow">每一步，都有迹可循</span><h2 id="headline">读取项目状态中</h2><p id="current" class="current"></p><div id="source-meta" class="subtle"></div></div>
        <div class="hero-progress"><div class="percent-row"><span id="percent">—</span><span class="unit">%</span><span class="progress-label">验收清单<br>完成率</span></div><progress id="overall" max="100" value="0" aria-label="验收清单完成率"></progress><p id="completion" class="count-line">等待数据</p></div>
        <p id="scope" class="scope">进度来自文件中的验收记录，正在加载计算口径。</p>
      </section>
      <div class="section-title"><h2>阶段地图</h2><span>点击阶段查看验收项</span></div>
      <section id="stages" class="stage-grid" aria-label="阶段列表"></section>
      <div class="two-columns">
        <section class="panel"><div class="panel-heading"><h2>接下来做什么</h2><span class="tag">按当前计划</span></div><div id="upcoming" class="next-list"></div></section>
        <section class="panel"><div class="panel-heading"><h2>版本分工</h2><span class="tag">独立输入 · 共享经验</span></div><div id="versions" class="versions"></div></section>
      </div>
      <section class="panel acceptance"><div class="panel-heading"><h2>验收项与证据</h2><button id="all-stages" type="button" class="quiet">全部阶段</button></div><div class="filters" role="group" aria-label="任务状态过滤"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="open" aria-pressed="false">待完成</button><button type="button" data-filter="done" aria-pressed="false">已验收</button><span id="task-count" class="subtle"></span></div><div id="tasks" class="task-list"></div></section>
      <div class="two-columns bottom-columns">
        <section class="panel"><div class="panel-heading"><h2>Git 更改记录</h2><span id="git-count" class="tag"></span></div><p id="git-meta" class="subtle"></p><p id="tracking" class="tracking"></p><details class="working-tree"><summary id="changes-title">工作树</summary><pre id="changes"></pre></details><div id="commits" class="commit-list"></div></section>
        <section class="panel"><div class="panel-heading"><h2>计划与 AI 交接</h2><span class="tag">本机文件</span></div><label class="subtle" for="plan-select">计划文件（按修改时间排序）</label><select id="plan-select"></select><p id="plan-date" class="subtle"></p><pre id="plan-content" class="note-content"></pre><details class="handoff" id="handoff-details"><summary>查看最新交接记录</summary><p id="handoff-date" class="subtle"></p><pre id="handoff-content" class="note-content"></pre></details></section>
      </div>
    </main>
    <footer><span>仅监听本机 · 只读面板 · 不执行计划文件中的命令</span><span id="observed">每 5 秒重新读取文件与 Git</span></footer>
  </div>
</body>
</html>
